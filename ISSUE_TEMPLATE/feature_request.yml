name: "✨ Feature request"
description: Suggest an idea for waydlp.
labels: [enhancement, triage]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which part?
      multiple: true
      options: [Desktop, Android, Installers / packaging, Website, CLI]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This does not require accounts, tracking, ads or DRM circumvention.
          required: true
