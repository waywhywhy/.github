name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter version (pinned; new releases can break CI)
        type: string
        default: '3.47.9'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
